timezone: America/Chicago
sqlite_path: ~/.tickrake/tickrake.sqlite3

default_provider: ibkr-paper
providers:
  tickrake:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4002
      client_id: 1001
      historical_timeout_seconds: 120
  massive:
    adapter: massive
    settings: {}
  schwab:
    adapter: schwab
    settings:
      rate_limit_max_requests: 120
      rate_limit_interval_seconds: 60
      restart_after_consecutive_failures: 3
      restart_cooldown_seconds: 10
    symbol_map:
      /ES: ^ES
      /NQ: ^NQ
      /RTY: ^RTY
      /YM: ^YM
  ibkr-paper:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4002
      client_id: 1001
      historical_timeout_seconds: 120
  ibkr-live:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 4001
      client_id: 1000
      historical_timeout_seconds: 120

options:
  snapshot_filename_timezone: utc
  root_tickers:
    SPXW: SPX

storage:
  data_dir: ~/.tickrake/data

datastores:
  s3_archive:
    type: s3
    bucket: tickrake
    region: us-east-1
    storage_class: GLACIER_IR

runtime:
  max_workers: 4
  retry_count: 3
  retry_delay_seconds: 5
  option_fetch_timeout_seconds: 60
  candle_fetch_timeout_seconds: 1800

universes:
  file: universes.yml

schedule:
  compact_spxw:
    type: maintenance
    provider: schwab
    run_at: "15:10"
    days: [mon, tue, wed, thu, fri]
    tasks:
      - compact:
          subject: option_samples
          universe: spx_symbols
          delete_sources: true
      - archive:
          subject: option_samples
          universe: spx_symbols
          destination: s3_archive
          artifacts: [csv, parquet]
          retain_local:
            csv: false
            parquet: true

  compact_non_spxw_option_samples:
    type: maintenance
    provider: schwab
    run_at: "15:20"
    days: [mon, tue, wed, thu, fri]
    tasks:
      - compact:
          subject: option_samples
          universe: nightly_non_spxw_option_symbols
          delete_sources: true
      - archive:
          subject: option_samples
          universe: nightly_non_spxw_option_symbols
          destination: s3_archive
          artifacts: [csv, parquet]
          retain_local:
            csv: false
            parquet: true

  stock_options:
    provider: schwab
    type: options
    interval_seconds: 1800
    windows:
      - days: [mon, tue, wed, thu, fri]
        start: "08:30"
        end: "15:05"
