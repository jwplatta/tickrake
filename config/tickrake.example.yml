timezone: America/Chicago
sqlite_path: ~/.tickrake/tickrake.sqlite3
# database:
#   backend: postgres # sqlite (default) or postgres
#   host: localhost
#   port: 5432
#   database: tickrake
#   user: postgres
#   password: secret
#   # Or connection url:
#   # url: postgres://user:password@localhost:5432/tickrake
default_provider: schwab
providers:
  schwab:
    adapter: schwab
    settings:
      restart_after_consecutive_failures: 3
      restart_cooldown_seconds: 30
    symbol_map:
      /ES: ^ES
      /NQ: ^NQ
      /RTY: ^RTY
  ibkr-paper:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 7497
      client_id: 1001
  massive:
    adapter: massive
    settings: {}
options:
  snapshot_filename_timezone: utc
  root_tickers:
    SPXW: SPX
imports:
  spxw_massive_options:
    type: options
    provider: massive
    ticker: SPX
    option_root: SPXW
    paths:
      - /Volumes/ext_docs/options_trader/polygon/minute_aggs_v1/2025/10/2025-10-01.csv
storage:
  data_dir: ~/.tickrake/data
  history_dir: ~/.tickrake/data/history
  options_dir: ~/.tickrake/data/options
  pending_metadata_dir: ~/.tickrake/staging/pending_metadata

datastores:
  minio_historical:
    type: minio
    bucket: tickrake-historical
    endpoint: http://minio:9000
    access_key_id: minioadmin
    secret_access_key: minioadmin
    force_path_style: true
  minio_intraday:
    type: minio
    bucket: intraday
    endpoint: http://minio:9000
    access_key_id: minioadmin
    secret_access_key: minioadmin
    force_path_style: true
runtime:
  max_workers: 4
  retry_count: 2
  retry_delay_seconds: 2
  option_fetch_timeout_seconds: 30
  candle_fetch_timeout_seconds: 60
universes:
  index_option_roots:
    file: universes/index_option_roots.yml
