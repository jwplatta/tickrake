timezone: America/Chicago

# Database Configuration (Rails ActiveRecord convention)
# adapter: sqlite3 or postgresql
database:
  adapter: <%= ENV.fetch('TICKRAKE_DB_ADAPTER', 'sqlite3') %>
  database: <%= ENV.fetch('TICKRAKE_DB_DATABASE', Tickrake::PathSupport.sqlite_path) %>
  # PostgreSQL options (when adapter is postgresql):
  # host: <%= ENV.fetch('TICKRAKE_DB_HOST', 'localhost') %>
  # port: <%= ENV.fetch('TICKRAKE_DB_PORT', 5432) %>
  # user: <%= ENV.fetch('TICKRAKE_DB_USER', 'tickrake_user') %>
  # password: <%= ENV.fetch('TICKRAKE_DB_PASSWORD', '') %>
  # url: <%= ENV.fetch('DATABASE_URL', nil) %>

# Target Datastores (MinIO or AWS S3)
staging_target:
  type: <%= ENV.fetch('STAGING_DATASTORE_TYPE', 's3_compatible') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', 'http://minio:9000') %>
  bucket: <%= ENV.fetch('TICKRAKE_STAGING_BUCKET', 'tickrake-staging') %>
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', 'minioadmin') %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', 'minioadmin') %>

intraday_target:
  type: <%= ENV.fetch('INTRADAY_DATASTORE_TYPE', 's3_compatible') %>
  endpoint: <%= ENV.fetch('MINIO_ENDPOINT', 'http://minio:9000') %>
  bucket: <%= ENV.fetch('TICKRAKE_INTRADAY_BUCKET', 'tickrake-intraday') %>
  access_key_id: <%= ENV.fetch('MINIO_ACCESS_KEY', 'minioadmin') %>
  secret_access_key: <%= ENV.fetch('MINIO_SECRET_KEY', 'minioadmin') %>

default_provider: schwab
providers:
  schwab:
    adapter: schwab
    settings:
      restart_after_consecutive_failures: 3
      restart_cooldown_seconds: 30
    symbol_map:
      /ES: ^ES
      /NQ: ^NQ
      /RTY: ^RTY
  ibkr-paper:
    adapter: ibkr
    settings:
      host: 127.0.0.1
      port: 7497
      client_id: 1001
  massive:
    adapter: massive
    settings: {}

options:
  snapshot_filename_timezone: utc
  root_tickers:
    SPXW: SPX

imports:
  spxw_massive_options:
    type: options
    provider: massive
    ticker: SPX
    option_root: SPXW
    paths:
      - /Volumes/ext_docs/options_trader/polygon/minute_aggs_v1/2025/10/2025-10-01.csv

storage:
  data_dir: <%= ENV.fetch('TICKRAKE_DATA_DIR', '~/.tickrake/data') %>
  candles_dir: ~/.tickrake/data/candles
  options_dir: ~/.tickrake/data/options
  pending_metadata_dir: ~/.tickrake/staging/pending_metadata

runtime:
  max_workers: 4
  retry_count: 2
  retry_delay_seconds: 2
  option_fetch_timeout_seconds: 30
  candle_fetch_timeout_seconds: 60

universes:
  index_option_roots:
    file: universes/index_option_roots.yml
