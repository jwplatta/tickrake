    provider: ibkr-paper
    type: candles
    interval_seconds: 120
    windows:
      - days: [mon, tue, wed, thu, fri]
        start: "08:30"
        end: "15:00"
    lookback_days: 7
    start_date: "2026-03-01"
    frequencies: [30min, 5min, 1min]
    universe: spx_symbols

  eod_candles:
    provider: ibkr-paper
    type: candles
    run_at: "15:05"
    days: [mon, tue, wed, thu, fri]
    lookback_days: 7
    start_date: "2020-01-01"
    frequencies: [day, 30min, 5min, 1min]
    universes: [eod_candle_symbols, futures_candle_symbols]

  sp500_day_candles:
    type: candles
    manual: true
    provider: ibkr-paper
    lookback_days: 7
    frequencies: [day]
    universe: sp500_day_symbols

  dashboard_candles:
    provider: ibkr-paper
    type: candles
    interval_seconds: 600
    lookback_days: 1
    frequencies: [day, 30min, 5min, 1min]
    windows:
      - days: [mon, tue, wed, thu, fri]
        start: "08:30"
        end: "15:05"
    universes: [dashboard_candle_symbols, futures_candle_symbols]

